name: CD

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          BOT_CONFIG_JSON_B64: ${{ secrets.BOT_CONFIG_JSON_B64 }}
          BOT_SERVICE_NAME: ${{ secrets.BOT_SERVICE_NAME }}
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          ssh -p "$VPS_SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' BOT_CONFIG_JSON_B64='$BOT_CONFIG_JSON_B64' BOT_SERVICE_NAME='$BOT_SERVICE_NAME' TARGET_BRANCH='$TARGET_BRANCH' REPO_URL='$REPO_URL' bash -s" <<'EOF'
          set -euo pipefail

          git config --global --add safe.directory "$VPS_APP_DIR"

          if [ ! -d "$VPS_APP_DIR/.git" ]; then
            git clone --branch "$TARGET_BRANCH" "$REPO_URL" "$VPS_APP_DIR"
          fi

          cd "$VPS_APP_DIR"
          git fetch --all --prune
          git checkout "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          rm -rf /tmp/nextcord
          git clone --depth 1 --branch components_v2 https://github.com/alentoghostflame/nextcord.git /tmp/nextcord

          python3.14 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          POETRY_DYNAMIC_VERSIONING_BYPASS=0.0.1 pip install /tmp/nextcord
          pip install -r requirements.txt

          sudo mkdir -p "$VPS_APP_DIR/config"
          printf '%s' "$BOT_CONFIG_JSON_B64" | base64 --decode | sudo tee "$VPS_APP_DIR/config/config.json" >/dev/null
          sudo chown bishokus:bishokus "$VPS_APP_DIR/config/config.json"
          sudo chmod 640 "$VPS_APP_DIR/config/config.json"

          sudo mkdir -p "$VPS_APP_DIR/.logs"
          sudo chown -R bishokus:bishokus "$VPS_APP_DIR/.logs"
          sudo chmod 755 "$VPS_APP_DIR/.logs"

          sudo systemctl daemon-reload
          sudo systemctl restart "$BOT_SERVICE_NAME"
          sudo systemctl is-active --quiet "$BOT_SERVICE_NAME"
          EOF
